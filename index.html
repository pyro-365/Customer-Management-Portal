<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Log in - Customer Management System</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="auth">
    <section class="auth-brand">
      <h1>Customer Management System</h1>
      <p>Shop, track your orders and manage your account in one place.</p>
    </section>
    <section class="auth-panel">
      <form id="login-form" class="auth-card" novalidate>
        <h2>Welcome back</h2>
        <p id="notice" class="form-ok"></p>
        <label for="identifier">Email or phone number</label>
        <input id="identifier" autocomplete="username" placeholder="you@example.com or 9876543210">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password">
        <p id="err" class="form-error" role="alert"></p>
        <button class="btn" type="submit">Log in</button>
        <a class="btn ghost" href="/register.html">Create account</a>
      </form>
    </section>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
